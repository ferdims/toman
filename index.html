<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKRAB TOMAN - MABAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0f0f0f;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* Hero Section - Dioptimalkan untuk HP (Portrait) dan Laptop (Landscape) */
        .hero {
            /* 100dvh memastikan tinggi pas dengan layar HP yang sering terpotong browser UI */
            min-height: 100dvh; 
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Teks ditaruh di atas agar tidak menutupi wajah */
            align-items: center;
            
            /* Overlay agar tulisan terbaca tajam */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), 
                        url('toman-grup.jpg'); 
            
            /* Sifat background agar tetap sama dan proporsional */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll; /* Lebih stabil untuk browser HP */
            
            border-bottom: 5px solid #ffde59;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(3.5rem, 15vw, 6.5rem); 
            margin: 0;
            color: #ffde59;
            text-shadow: 0 0 20px rgba(255, 222, 89, 0.6), 2px 2px 10px #000;
            letter-spacing: 5px;
            line-height: 1;
        }

        .subtitle {
            font-size: clamp(1rem, 5vw, 1.8rem);
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 2px 2px 5px #000;
        }

        /* Detail Section */
        .content {
            padding: 60px 20px;
            background: #0f0f0f;
        }

        /* Efek Glassmorphism untuk Card */
        .card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 450px;
            margin: 0 auto;
            border: 1px solid rgba(255, 222, 89, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .info-row {
            margin: 25px 0;
            border-bottom: 1px dashed rgba(255, 222, 89, 0.2);
            padding-bottom: 15px;
        }

        .info-row:last-child { border: none; }

        .label { 
            color: #ffde59; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            font-size: 0.85rem; 
        }

        /* Animasi Tombol Pulse */
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 222, 89, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 222, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 222, 89, 0); }
        }

        .btn {
            display: inline-block;
            padding: 18px 35px;
            background: #ffde59;
            color: #000;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            margin-top: 15px;
            transition: all 0.3s ease;
            animation: pulse-animation 2s infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #fff;
        }

        /* Penyesuaian Khusus HP */
        @media (max-width: 600px) {
            .hero {
                padding-top: 80px; /* Jarak atas disesuaikan agar teks nangkring pas */
                background-position: center top 20%; /* Foto digeser sedikit ke bawah agar wajah kelihatan */
            }
            .card {
                padding: 25px 20px;
            }
        }

        footer {
            padding: 40px;
            font-size: 0.8rem;
            color: #666;
            background: #0f0f0f;
        }
    </style>
</head>
<body>

    <section class="hero">
        <p style="letter-spacing: 4px; margin-bottom: 5px; text-shadow: 2px 2px 5px #000; font-size: 0.8rem;">YOU ARE INVITED TO</p>
        <h1>MABAR</h1>
        <p class="subtitle">(MABOK AKBAR)</p>
    </section>

    <section class="content">
        <div class="card">
            <h2 style="color: #ffde59; margin-top: 0; font-family: 'Bebas Neue', cursive; font-size: 2.3rem; letter-spacing: 1px;">Let's Get Tipsy Together!</h2>
            <p style="color: #ddd; line-height: 1.6; margin-bottom: 30px;">Merapat, curhat, dan pererat solidaritas kita di acara Makrab TOMAN tahun ini.</p>
            
            <div class="info-row">
                <span class="label">KAPAN?</span>
                Sabtu - Minggu, 20-21 Juni 2026
            </div>

            <div class="info-row">
                <span class="label">DI MANA?</span>
                TBA
            </div>

            <div class="info-row">
                <span class="label">HTM</span>
                TBA
            </div>

            <a href="https://forms.gle/KRBkvwjev5GhBfRn7" class="btn">KONFIRMASI KEHADIRAN</a>
        </div>
    </section>

    <footer>
        &copy; 2026 TOMAN. No Drama, Just Drinks.
    </footer>

</body>
</html>
