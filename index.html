<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKRAB TOMAN - MABAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #000000;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100dvh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), 
                              url('toman-grup.jpeg'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            border-bottom: 5px solid #ffde59;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(3.5rem, 12vw, 6.5rem); 
            margin: 0;
            color: #ffde59;
            text-shadow: 0 0 20px rgba(255, 222, 89, 0.6), 2px 2px 10px #000;
            letter-spacing: 5px;
            line-height: 1;
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 2px 2px 5px #000;
        }

        /* ----- Gaya Timer ----- */
        .timer-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 222, 89, 0.3);
            backdrop-filter: blur(5px);
        }

        .timer-segment {
            display: flex;
            flex-direction: column;
        }

        .timer-value {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem;
            color: #ffde59;
            line-height: 1;
        }

        .timer-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        /* ---------------------- */

        .content {
            padding: 60px 20px;
            background: #0f0f0f;
        }

        .card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 450px;
            margin: 0 auto;
            border: 1px solid rgba(255, 222, 89, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .info-row {
            margin: 20px 0;
            border-bottom: 1px dashed rgba(255, 222, 89, 0.2);
            padding-bottom: 10px;
        }

        .info-row:last-child { border: none; }

        .label { color: #ffde59; font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9rem; }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 222, 89, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 222, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 222, 89, 0); }
        }

        .btn {
            display: inline-block;
            padding: 18px 35px;
            background: #ffde59;
            color: #000;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            margin-top: 20px;
            transition: all 0.3s ease;
            animation: pulse-animation 2s infinite;
            text-transform: uppercase;
        }

        footer {
            padding: 40px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
        }

        @media (min-width: 1024px) {
            .hero { background-size: cover; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <p style="letter-spacing: 3px; margin-bottom: 10px; text-shadow: 2px 2px 5px #000;">YOU ARE INVITED TO</p>
        <h1>MABAR</h1>
        <p class="subtitle">(MABOK AKBAR)</p>

        <div class="timer-container">
            <div class="timer-segment">
                <span class="timer-value" id="days">00</span>
                <span class="timer-label">Hari</span>
            </div>
            <div class="timer-segment">
                <span class="timer-value" id="hours">00</span>
                <span class="timer-label">Jam</span>
            </div>
            <div class="timer-segment">
                <span class="timer-value" id="minutes">00</span>
                <span class="timer-label">Menit</span>
            </div>
            <div class="timer-segment">
                <span class="timer-value" id="seconds">00</span>
                <span class="timer-label">Detik</span>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="card">
            <h2 style="color: #ffde59; margin-top: 0; font-family: 'Bebas Neue', cursive; font-size: 2.2rem;">Let's Get Tipsy Together!</h2>
            <p>Merapat, curhat, dan pererat solidaritas kita di acara Makrab TOMAN.</p>
            
            <div class="info-row">
                <span class="label">KAPAN?</span>
                Sabtu - Minggu, 20-21 Juni 2026
            </div>

            <div class="info-row">
                <span class="label">DI MANA?</span>
                Villa
            </div>

            <div class="info-row">
                <span class="label">HTM</span>
                TBA
            </div>

            <a href="https://forms.gle/KRBkvwjev5GhBfRn7" class="btn">KONFIRMASI KEHADIRAN</a>
        </div>
    </section>

    <footer>
        &copy; 2026 TOMAN. No Drama, Just Drinks.
    </footer>

    <script>
        // Set tanggal tujuan (20 Juni 2026 jam 15:00 WIB)
        const targetDate = new Date("June 20, 2026 15:00:00").getTime();

        const updateTimer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Perhitungan waktu
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            // Masukkan ke elemen HTML
            document.getElementById("days").innerHTML = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerHTML = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerHTML = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerHTML = s < 10 ? "0" + s : s;

            // Jika waktu habis
            if (distance < 0) {
                clearInterval(updateTimer);
                document.querySelector(".timer-container").innerHTML = "<span class='timer-value'>WAKTUNYA MABAR!</span>";
            }
        }, 1000);
    </script>

</body>
</html>
